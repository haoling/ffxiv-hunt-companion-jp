name: Update hunts.json

# ゲームデータ（ffxiv-datamining、Teamcraft）から public/data/hunts.json を再生成し、
# 変更があれば PR を作る。手順の詳細は docs/m1/REPORT.md。
# 事前に、リポジトリの Settings > Actions > General で
# 「Allow GitHub Actions to create and approve pull requests」を有効にしておく。

on:
  schedule:
    # 毎週水曜 12:17 JST（パッチは火曜に来ることが多い）
    - cron: "17 3 * * 3"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-data
  cancel-in-progress: false

env:
  BRANCH: bot/update-hunts-data

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # TypeScript をそのまま実行するため 22.18 以上が必要
          node-version: 24

      - name: Fetch ffxiv-datamining
        run: git clone --depth 1 https://github.com/xivapi/ffxiv-datamining ../ffxiv-datamining

      - name: Fetch Teamcraft (fates.json, monsters.json)
        run: |
          git clone --depth 1 --filter=blob:none --no-checkout https://github.com/ffxiv-teamcraft/ffxiv-teamcraft ../teamcraft
          git -C ../teamcraft sparse-checkout set --no-cone /libs/data/src/lib/json/fates.json /libs/data/src/lib/json/monsters.json
          git -C ../teamcraft checkout

      - name: Build hunts.json
        run: npm run build:data

      - name: Detect changes
        id: diff
        run: |
          # 生成元のコミット（meta.sources）だけが変わったときは、データは同じなので PR にしない
          git show HEAD:public/data/hunts.json | jq -S 'del(.meta.sources)' > /tmp/old.json
          jq -S 'del(.meta.sources)' public/data/hunts.json > /tmp/new.json
          if cmp -s /tmp/old.json /tmp/new.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "データに変更なし"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DM=$(jq -r .meta.sources.datamining public/data/hunts.json)
          TC=$(jq -r .meta.sources.teamcraft public/data/hunts.json)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add public/data/hunts.json
          git commit -m "ゲームデータから hunts.json を再生成する（datamining ${DM}、Teamcraft ${TC}）"
          git push --force origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')" ]; then
            gh pr create --draft --base "${{ github.event.repository.default_branch }}" --head "$BRANCH" \
              --title "ゲームデータから hunts.json を再生成する" \
              --body "ゲームデータ（ffxiv-datamining \`${DM}\`、Teamcraft \`${TC}\`）から \`public/data/hunts.json\` を自動で再生成しました（[update-data.yml](.github/workflows/update-data.yml)）。パッチでの対象や名前の変更、Teamcraft の実測位置の更新が含まれます。マージするとデプロイされます。"
          fi
